<!-- Declarar ao navegador qual a versão do html -->
<!DOCTYPE html>
<!-- informa aos navegadores, leitores de tela e mecanismos de busca que o site é em pt-br -->
<html lang="pt-BR">
<!-- Configurações do site -->

<head>
    <!-- metadado para  o teclado alfanumérico -->
    <meta charset="UTF-8">
    <!-- metadado para design responsivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página -->
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- corpo do site -->

<body>
    <header>
        <div class="login">
            <a href="">Login</a>
        </div>
    </header>

    <!-- conteúdo principal do site -->
    <main>
        <div>
            <h1>Encontre a viagem <br> do seus sonhos</h1>
            <p>
                Desbrave nosso site e descubra aventuras. <br>
                Conheça nosso blog e econtre um destino paradisíaco
            </p>
        </div>

        <div class="inputs">
            <input type="text" placeholder="Dige o seu nome" class="inputNome">
            <div class="entrarEmail">
                <br>
                <input type="email" placeholder="Digite o seu e-mail" class="inputEmail">
                <button>Entrar</button>
            </div>
        </div>

        <div class="redes">
            <a href="https://facebook.com"><img src="img/facebook.png" alt="Ícone do Facebook"></a>
            <a href="https://linkedin.com"><img src="img/linkedin.png" alt="Ícone do linkedin"></a>
            <a href="https://instagram.com"><img src="img/instagram.png" alt="Ícone instagram"></a>
        </div>
    </main>
</body>

</html>
